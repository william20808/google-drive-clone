services:
  db:
    image: postgres:16-alpine
    container_name: gdrive_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gdrive_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: gdrive_web
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=change_this_in_production_super_secret_key
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/gdrive_db
      - PYTHONUNBUFFERED=1
    volumes:
      - media_data:/app/media
      - ./staticfiles:/app/staticfiles
    command: >
      sh -c "pip install psycopg2-binary &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn gdrive_project.wsgi:application --bind 0.0.0.0:8000 --workers 3"

volumes:
  postgres_data:
  media_data:
