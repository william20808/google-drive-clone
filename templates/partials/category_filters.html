<div class="flex flex-wrap items-center justify-between gap-3 my-3">
    <!-- Category Filter Pills -->
    <div class="flex items-center flex-wrap gap-2">
        {% with current_cat=active_category|default:'all' %}
            <a href="?category=all{% if search_query %}&q={{ search_query }}{% endif %}&view={{ view_mode }}" 
               class="badge badge-lg border px-3 py-3 rounded-full text-xs font-medium cursor-pointer transition {% if current_cat == 'all' %}bg-gdrive-active text-gdrive-blue border-transparent font-semibold shadow-xs{% else %}bg-white dark:bg-[#1e1f20] text-gray-700 dark:text-gray-200 border-gray-200 dark:border-[#3c4043] hover:bg-gray-100 dark:hover:bg-white/10{% endif %}">
                All
            </a>
            <a href="?category=documents{% if search_query %}&q={{ search_query }}{% endif %}&view={{ view_mode }}" 
               class="badge badge-lg border px-3 py-3 rounded-full text-xs font-medium cursor-pointer transition {% if current_cat == 'documents' %}bg-gdrive-active text-gdrive-blue border-transparent font-semibold shadow-xs{% else %}bg-white dark:bg-[#1e1f20] text-gray-700 dark:text-gray-200 border-gray-200 dark:border-[#3c4043] hover:bg-gray-100 dark:hover:bg-white/10{% endif %}">
                <svg class="w-3.5 h-3.5 mr-1.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Documents
            </a>
            <a href="?category=images{% if search_query %}&q={{ search_query }}{% endif %}&view={{ view_mode }}" 
               class="badge badge-lg border px-3 py-3 rounded-full text-xs font-medium cursor-pointer transition {% if current_cat == 'images' or current_cat == 'photos' or current_cat == 'photos & images' or current_cat == 'photos_images' %}bg-gdrive-active text-gdrive-blue border-transparent font-semibold shadow-xs{% else %}bg-white dark:bg-[#1e1f20] text-gray-700 dark:text-gray-200 border-gray-200 dark:border-[#3c4043] hover:bg-gray-100 dark:hover:bg-white/10{% endif %}">
                <svg class="w-3.5 h-3.5 mr-1.5 text-rose-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"/>
                </svg>
                Photos & images
            </a>
            <a href="?category=pdf{% if search_query %}&q={{ search_query }}{% endif %}&view={{ view_mode }}" 
               class="badge badge-lg border px-3 py-3 rounded-full text-xs font-medium cursor-pointer transition {% if current_cat == 'pdf' or current_cat == 'pdfs' %}bg-gdrive-active text-gdrive-blue border-transparent font-semibold shadow-xs{% else %}bg-white dark:bg-[#1e1f20] text-gray-700 dark:text-gray-200 border-gray-200 dark:border-[#3c4043] hover:bg-gray-100 dark:hover:bg-white/10{% endif %}">
                <svg class="w-3.5 h-3.5 mr-1.5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/>
                </svg>
                PDFs
            </a>
            <a href="?category=videos{% if search_query %}&q={{ search_query }}{% endif %}&view={{ view_mode }}" 
               class="badge badge-lg border px-3 py-3 rounded-full text-xs font-medium cursor-pointer transition {% if current_cat == 'videos' or current_cat == 'video' %}bg-gdrive-active text-gdrive-blue border-transparent font-semibold shadow-xs{% else %}bg-white dark:bg-[#1e1f20] text-gray-700 dark:text-gray-200 border-gray-200 dark:border-[#3c4043] hover:bg-gray-100 dark:hover:bg-white/10{% endif %}">
                <svg class="w-3.5 h-3.5 mr-1.5 text-purple-600" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"/>
                </svg>
                Videos
            </a>
            <a href="?category=audio{% if search_query %}&q={{ search_query }}{% endif %}&view={{ view_mode }}" 
               class="badge badge-lg border px-3 py-3 rounded-full text-xs font-medium cursor-pointer transition {% if current_cat == 'audio' %}bg-gdrive-active text-gdrive-blue border-transparent font-semibold shadow-xs{% else %}bg-white dark:bg-[#1e1f20] text-gray-700 dark:text-gray-200 border-gray-200 dark:border-[#3c4043] hover:bg-gray-100 dark:hover:bg-white/10{% endif %}">
                <svg class="w-3.5 h-3.5 mr-1.5 text-amber-500" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z"/>
                </svg>
                Audio
            </a>
            <a href="?category=folders{% if search_query %}&q={{ search_query }}{% endif %}&view={{ view_mode }}" 
               class="badge badge-lg border px-3 py-3 rounded-full text-xs font-medium cursor-pointer transition {% if current_cat == 'folders' or current_cat == 'folder' %}bg-gdrive-active text-gdrive-blue border-transparent font-semibold shadow-xs{% else %}bg-white dark:bg-[#1e1f20] text-gray-700 dark:text-gray-200 border-gray-200 dark:border-[#3c4043] hover:bg-gray-100 dark:hover:bg-white/10{% endif %}">
                <svg class="w-3.5 h-3.5 mr-1.5 text-amber-500" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/>
                </svg>
                Folders
            </a>
        {% endwith %}
    </div>

    <!-- View Mode Switcher (Grid / List) -->
    <div class="flex items-center bg-gray-100 dark:bg-[#1e1f20] p-1 rounded-xl border border-gray-200 dark:border-[#3c4043]">
        <a href="?{% if active_category %}category={{ active_category }}&{% endif %}{% if search_query %}q={{ search_query }}&{% endif %}view=grid" 
           class="p-1.5 rounded-lg transition {% if view_mode == 'grid' %}bg-white dark:bg-[#2d2e30] text-gdrive-blue shadow-xs font-bold{% else %}text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white{% endif %}"
           title="Grid view">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
        </a>
        <a href="?{% if active_category %}category={{ active_category }}&{% endif %}{% if search_query %}q={{ search_query }}&{% endif %}view=list" 
           class="p-1.5 rounded-lg transition {% if view_mode == 'list' %}bg-white dark:bg-[#2d2e30] text-gdrive-blue shadow-xs font-bold{% else %}text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white{% endif %}"
           title="List view">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </a>
    </div>
</div>
