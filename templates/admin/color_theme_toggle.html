{% load i18n %}
<!-- Two-state Light / Dark Mode Toggle (Strictly No Half/Auto Mode) -->
<button 
    type="button" 
    class="gdrive-admin-theme-toggle" 
    id="gdrive-admin-theme-toggle" 
    onclick="toggleAdminTheme(event)" 
    title="Toggle Light / Dark mode" 
    aria-label="Toggle theme">
    <!-- Sun icon: displayed in dark mode -->
    <svg class="admin-theme-icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
    </svg>
    <!-- Moon icon: displayed in light mode -->
    <svg class="admin-theme-icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
    </svg>
</button>

<script>
    function toggleAdminTheme(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        var cur = document.documentElement.dataset.theme;
        var next = (cur === 'dark') ? 'light' : 'dark';

        // Instantaneous switch: prevent CSS transitions during repaint
        var css = document.createElement('style');
        css.id = 'admin-theme-transition-disabler';
        css.textContent = '*, *::before, *::after { -webkit-transition: none !important; transition: none !important; }';
        document.head.appendChild(css);
        if (document.body) window.getComputedStyle(document.body).opacity;

        document.documentElement.dataset.theme = next;
        localStorage.setItem('theme', next);
        localStorage.setItem('gdrive_theme', next);

        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                var el = document.getElementById('admin-theme-transition-disabler');
                if (el) el.remove();
            });
        });
    }

    // Immediately resolve and purge any legacy 'auto' state - strictly 2-state (light / dark)
    (function() {
        var t = localStorage.getItem('theme');
        if (!t || t === 'auto') {
            t = 'light';
            localStorage.setItem('theme', 'light');
        }
        document.documentElement.dataset.theme = t;
    })();
</script>
